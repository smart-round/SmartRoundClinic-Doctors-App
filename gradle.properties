#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
# GitHub's standard macOS runner (macos-15) has only 7GB RAM total, shared with Xcode's own
# build system and Ruby/fastlane. Running the K/N compiler as its own daemon means two large
# JVMs competing for that budget at once — instead of a fast, clean OOM they thrash into swap
# and hang indefinitely. Folding K/N compilation into the single Gradle JVM (sized below) avoids
# the double-heap overhead entirely.
kotlin.native.disableCompilerDaemon=true

#Gradle
# Confirmed via CI logs: with the K/N daemon disabled above, only one JVM process runs during
# the iOS framework build (no more double-heap contention) — it now fails cleanly at the very
# last step (linking Firebase/RealtimeKit/KMPNotifier's cinterop libs into the exported
# framework), the most memory-hungry part of a K/N build. Raising the ceiling since there's no
# longer a second process to share the 7GB runner with.
org.gradle.jvmargs=-Xmx5120M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.builtInKotlin=false
android.newDsl=false
android.nonTransitiveRClass=true
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.dependency.excludeLibraryComponentsFromConstraints=true
